[package]
name = "driver-mysql"
version = "0.1.0"
description = "MySQL database driver (via sqlx)"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1.89"
bigdecimal = "0.4.7"
database.workspace = true
models.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["mysql", "uuid", "time", "json", "bigdecimal"] }
time = "0.3.41"
uuid = "1.17.0"

[dev-dependencies]
tokio.workspace = true

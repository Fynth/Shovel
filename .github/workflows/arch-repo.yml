name: Publish Arch Repo

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v"
        required: true
        type: string
      git_ref:
        description: "Git ref or commit to package; defaults to the current workflow commit"
        required: false
        type: string

concurrency:
  group: arch-repo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-arch-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    permissions:
      contents: write

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
            git_ref="${{ github.event.inputs.git_ref }}"
            if [[ -n "${git_ref}" ]]; then
              source_selector="commit=${git_ref}"
            else
              source_selector="commit=${GITHUB_SHA}"
            fi
          else
            version="${GITHUB_REF_NAME#v}"
            source_selector="tag=v${version}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "source_selector=${source_selector}" >> "${GITHUB_OUTPUT}"

      - name: Install Arch build dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm \
            git \
            pacman-contrib \
            rust \
            pkgconf \
            gtk3 \
            webkit2gtk-4.1 \
            xdotool \
            fakeroot

      - name: Render Arch packaging files
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/render-arch-package.sh \
            "${{ steps.meta.outputs.version }}" \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}" \
            "${GITHUB_WORKSPACE}/packaging/arch/generated" \
            "${{ steps.meta.outputs.source_selector }}"

      - name: Build Arch package
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          su builder -c "cd '${GITHUB_WORKSPACE}/packaging/arch/generated' && makepkg --noconfirm --cleanbuild --clean"

      - name: Build pacman repository metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pacman-repo/arch/x86_64
          cp packaging/arch/generated/*.pkg.tar.* pacman-repo/arch/x86_64/
          ./scripts/build-pacman-repo.sh pacman-repo/arch/x86_64 shovel
          cat <<'EOF' > pacman-repo/index.html
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Shovel Arch Repository</title>
          </head>
          <body>
            <h1>Shovel Arch Repository</h1>
            <p>Repository URL: <code>https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/arch/$arch</code></p>
          </body>
          </html>
          EOF

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: shovel-arch-package
          path: packaging/arch/generated/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release assets
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          files: |
            packaging/arch/generated/*.pkg.tar.*
